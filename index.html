<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Պատվերների կառավարում</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">

    <div>
        <h1>📦 Պատվերների կառավարում</h1>
        <p>Դիսպետչերի համակարգ</p>
    </div>

    <button class="add-btn" onclick="openOrderModal()">
        ＋ Նոր պատվեր
    </button>

</header>


<main class="container">

    <section class="orders-section">

        <div class="section-header">

            <h2>Պատվերներ</h2>

            <input
                type="text"
                id="searchInput"
                placeholder="🔎 Որոնել հասցե..."
                oninput="renderOrders()"
            >

        </div>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>
                        <th>Աղբյուր</th>
                        <th>Ստեղծման ժամ</th>
                        <th>Գումար</th>
                        <th>Առաքման հասցե</th>
                        <th>Կոորդինատներ</th>
                        <th>Պատրաստման ժամանակ</th>
                        <th>Մնացած ժամանակ</th>
                        <th>Map</th>
                        <th>Կարգավիճակ</th>
                        <th>Գործողություններ</th>
                    </tr>

                </thead>

                <tbody id="ordersTable"></tbody>

            </table>


            <div id="emptyState" class="empty-state">
                📦 Պատվերներ դեռ չկան
            </div>

        </div>

    </section>

</main>



<!-- =========================
     ՆՈՐ / ՓՈՓՈԽԵԼ ՊԱՏՎԵՐ
========================= -->

<div id="orderModal" class="modal">

    <div class="modal-content">

        <div class="modal-header">

            <h2 id="modalTitle">Նոր պատվեր</h2>

            <button
                class="close-btn"
                onclick="closeOrderModal()"
            >
                ×
            </button>

        </div>


        <form id="orderForm">


            <!-- ԱՂԲՅՈՒՐ -->

            <label>

                Աղբյուր

                <select id="source" required>

                    <option value="">
                        Ընտրել աղբյուրը
                    </option>

                    <option value="Yandex">
                        Yandex
                    </option>

                    <option value="Murakami">
                        Murakami
                    </option>

                    <option value="Yerevan City">
                        Yerevan City
                    </option>

                </select>

            </label>


            <!-- ՍՏԵՂԾՄԱՆ ԺԱՄ -->

            <label>

                Ստեղծման ժամ

                <input
                    type="time"
                    id="createdTime"
                    required
                >

            </label>


            <!-- ԳՈՒՄԱՐ -->

            <label>

                Ընդհանուր գումար

                <input
                    type="number"
                    id="amount"
                    placeholder="13800"
                    min="0"
                    required
                >

            </label>


            <!-- ՀԱՍՑԵ -->

            <label>

                Առաքման հասցե

                <textarea
                    id="address"
                    placeholder="Երևան, Սարյան 24Բ, բն. 61/2..."
                    required
                ></textarea>

            </label>


            <!-- ԿՈՈՐԴԻՆԱՏ -->

            <label>

                Կոորդինատներ

                <input
                    type="text"
                    id="coordinates"
                    placeholder="40.18407, 44.50422"
                >

                <small>
                    Օրինակ՝ 40.18407, 44.50422
                </small>

            </label>


            <!-- ՊԱՏՐԱՍՏՄԱՆ ԺԱՄԱՆԱԿ -->

            <label>

                Պատրաստման ժամանակ

                <select
                    id="preparationTime"
                    required
                >

                    <option value="">
                        Ընտրել
                    </option>

                    <option value="10">
                        10 րոպե
                    </option>

                    <option value="20">
                        20 րոպե
                    </option>

                    <option value="30">
                        30 րոպե
                    </option>

                    <option value="40">
                        40 րոպե
                    </option>

                    <option value="50">
                        50 րոպե
                    </option>

                </select>

            </label>


            <!-- ԳՈՐԾՈՂՈՒԹՅՈՒՆՆԵՐ -->

            <div class="modal-actions">

                <button
                    type="button"
                    class="cancel-btn"
                    onclick="closeOrderModal()"
                >
                    Չեղարկել
                </button>

                <button
                    type="submit"
                    class="save-btn"
                >
                    💾 Պահպանել
                </button>

            </div>

        </form>

    </div>

</div>



<!-- =========================
     ԺԱՄԱՉԱՓԻ ՓՈՓՈԽՈՒԹՅՈՒՆ
========================= -->

<div id="confirmModal" class="modal">

    <div class="confirm-content">

        <h2>⚠️ Փոխել ժամաչափը</h2>

        <p>
            Պատրաստման ժամանակը փոխվել է։
            Ցանկանո՞ւմ եք ժամաչափը սկսել նորից։
        </p>


        <div class="modal-actions">

            <button
                class="cancel-btn"
                onclick="finishEdit(false)"
            >
                Ոչ
            </button>

            <button
                class="save-btn"
                onclick="finishEdit(true)"
            >
                Այո, սկսել նորից
            </button>

        </div>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
